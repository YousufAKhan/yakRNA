# yakRNA Design Environment - Linux with CUDA
# For macOS / CPU, use environment-macos.yml

name: yakrna
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pytorch>=2.1.0
  - pytorch-cuda>=12.1
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  - tqdm>=4.65
  - pyyaml>=6.0
  - h5py>=3.8
  - pip
  - pip:
    # Lower bound: ModernBERT was added in transformers 4.48.
    # Upper bound: transformers >=5.7 calls torch.accelerator, which needs
    # torch >=2.6, while the pytorch conda channel tops out at 2.5.1 - that
    # combination makes ModernBertForMaskedLM fail to import outright.
    # Verified working: torch 2.5.1 + transformers 5.6.0 (and torch 2.7 + 4.52).
    - transformers>=4.48.0,<5.7
    - accelerate>=0.30.0
    - biopython>=1.83
    - huggingface_hub>=1.0.0
