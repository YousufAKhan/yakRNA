# YAK RNA Environment - macOS
# For Linux with CUDA, use environment-linux.yml

name: yakrna
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pytorch>=2.0
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - pyyaml
  - h5py
  - pip
  - pip:
    # ModernBERT needs >=4.48; <5.7 keeps it compatible with the torch the
    # conda channels provide (transformers >=5.7 requires torch >=2.6).
    - transformers>=4.48.0,<5.7
    - accelerate
    - biopython
    - huggingface_hub>=1.0.0
