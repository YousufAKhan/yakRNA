# ============================================================================
# yakRNA Design - 110M production recipe
#
# This is the configuration that produced the released checkpoint
# (checkpoints/yakRNA_110M.pt, 110M parameters, 50,000 steps), recovered from
# the `config` entry stored inside that checkpoint. Only the data paths and the
# W&B identifiers have been changed: the original run read its data from
# node-local scratch, this file points at the repo-relative layout produced by
# the data pipeline in TRAINING.md.
#
# Launch (8 GPUs on one node, as the original run used):
#   torchrun --nproc_per_node=8 rna_gen/rna_gen_training.py --config configs/train_110M.yaml
# ============================================================================

# 'random' draws a fresh seed each run and logs it; use an integer to fix it.
random_seed: 'random'

data_files:
  h5_file: "training_data/processed/bert_ready_data.h5"
  vocabulary_file: "training_data/processed/vocabulary_analysis/unified_vocabulary.json"
  family_splits_file: "training_data/processed/family_splits.json"
  family_lookup_file: "training_data/processed/family_lookup.json"
  # Read the whole HDF5 file into RAM up front (needs ~1.5x the file size free).
  load_data_into_ram: false
  # Optional node-local scratch. When set, the four files above are copied there
  # once and read from the copy - a large win on clusters with slow shared
  # storage. Environment variables are expanded (e.g. "$L_SCRATCH/yakRNA").
  # Leave empty to read the files in place.
  temporary_processing_directory: ""

data:
  # Total token budget per sample: 6 special tokens + sequence + structure +
  # consensus + GO terms. Samples longer than this are skipped, not truncated.
  # ModernBERT supports up to 8192.
  max_position_embeddings: 1920
  max_go_terms: 12
  # Lengths warmed up once at startup so the first real batches do not pay
  # compilation cost for every new shape.
  sequence_buckets: [704, 832, 1024, 1280, 1408, 1536, 1792, 1920]
  # Splits are by Rfam family, so no family appears in more than one split.
  train_split: 0.9
  val_split: 0.05
  test_split: 0.05
  # The released model was trained on every family (val/test are still held out
  # for the metrics that get reported, they are just not withheld from training).
  # Set to false for a clean held-out evaluation.
  use_all_data_for_training: true
  batch_size: 96          # per GPU
  num_workers: 4
  pin_memory: true
  padding_label_id: -100  # label id ignored by the loss

device: "cuda"            # "cuda", "cpu", or "auto"

model_architecture:
  # ~110M parameters with the unified multimodal vocabulary.
  model_size:
    num_hidden_layers: 12
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 3072

optimizations:
  flash_attention:
    enabled: true         # falls back silently if flash-attn is not installed
    version: 2
  memory:
    gradient_checkpointing: true
    use_cache: true
  xformers:
    enabled: true
    attention_op: "cutlass"
  mixed_precision:
    enabled: true
    precision: "bf16"     # bf16 needs no gradient scaling
    loss_scaling: "none"
  torch_compile:
    enabled: true
    mode: "default"       # "default", "reduce-overhead", "max-autotune"
  dataloader:
    persistent_workers: false
    prefetch_factor: 1
    drop_last: true
    timeout: 30
  distributed:
    strategy: "ddp"
    cpu_offload: false
    mixed_precision_policy: "bf16"
  modernbert_native_features:
    # Informational only - these are intrinsic to ModernBERT, not toggles.
    rope_integrated: true
    unpadding_integrated: true
    alternating_attention: true
    hardware_optimized: true

training:
  # Mask out logits for tokens that belong to a different modality than the
  # position being predicted.
  apply_vocab_constraints: true
  learning_rate: 1e-4
  dropout:
    attention_dropout: 0.15
    hidden_dropout: 0.15
  validation_freq_steps: 50
  print_freq: 10
  max_steps: 50000
  validation_num_samples: 768
  # true pins the validation samples, masks and noise for a run (seeded by
  # random_seed) so successive validations are directly comparable.
  stale_validation: false
  model_save_freq_steps: 1000
  accumulate_validation_stats: true
  eval_on_test: true
  # The published run walked the entire test split at the end of training.
  # Uncomment to cap it (the full split is ~5% of 4M sequences):
  # test_num_samples: 10000
  weight_decay: 0.1
  mixed_precision: true
  set_kmp_duplicate_lib_ok: false   # only needed on some macOS/MKL setups
  output_dir: outputs
  lr_scheduler:
    # Supported: 'cosine_with_restarts' and 'linear_warmup'. The released run
    # was configured with 'cosine', which is not a recognized value, so it
    # trained with linear warmup + linear decay - kept here as-is so this file
    # reproduces that run. Use 'cosine_with_restarts' for a cosine schedule.
    type: "cosine"
    warmup_steps: 1000
    cycles: 1
  # Phase 1 learns the joint multimodal representation with span MLM; phase 2
  # continues from those weights with the discrete diffusion objective.
  two_phase_training:
    enabled: true
    mlm_phase_steps: 45000
    diffusion_phase_steps: 5000
    transition_smooth: true
  MLM_masking:
    rate: 0.35
    span_masking:
      enabled: true
      min_span_length: 2
      max_span_length: 8
      geometric_p: 0.3    # mean span ~3.3 tokens
    # Whole conditioning modalities replaced with [DROPPED] before masking, so
    # the model learns to work from any subset of modalities.
    modality_dropout_rates:
      ss: 0.5
      consensus: 0.5
      go_terms: 0.5
  diffusion:
    num_timesteps: 100
    # Absorbing-state (mask) corruption of the sequence modality, ramped from
    # initial_rate to target_percentage across the timestep range.
    cumulative_masking:
      target_percentage: 0.9
      schedule_type: "cosine"
      initial_rate: 0.0
    loss_type: "cross-entropy"   # "cross-entropy", "simple", "elbo"
    sequence_loss_weight: 1.0
    modality_dropout_rates:
      ss: 0.5
      consensus: 0.5
      go_terms: 0.5
    guidance_scale: 1.0
    random_timestep_sampling: true
  # MLM-phase loss weights; must sum to 1.0.
  modality_loss_weights:
    sequence: 0.85
    secondary_structure: 0.05
    consensus: 0.05
    go_terms: 0.05
  # Down-weights consensus errors that get the letter right but the case wrong.
  consensus_case_penalty_factor: 0.5
  unique_tracking:
    max_unique_sequences: 10000000
    max_unique_families: 10000

wandb:
  project: rna-multimodal-production
  # Your W&B user or team; leave empty to use your default entity.
  entity:
  run_name: yakrna_110m_8gpu
  # "online", "offline" (sync later with `wandb sync`), or "disabled".
  # Training works without wandb installed at all.
  mode: "online"
  log_model: true
  log_frequency: 100

checkpoint:
  resume_from_checkpoint: false
  checkpoint_path: null
  checkpoint_prefix: yakRNA_110M
  resume_training: false
  resume_optimizer: false
  resume_scheduler: false
  resume_step: false
  validate_checkpoint: false
  override_config: false
